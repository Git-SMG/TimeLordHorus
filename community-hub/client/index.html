<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Downriver SE Michigan Community Interconnect Hub — free resources, bulletin board, messaging, and marketplace.">
  <title>Downriver Community Hub</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏘️</text></svg>">
</head>
<body>

<!-- ── Top Navigation ──────────────────────────────────────────────────────── -->
<nav class="top-nav" id="topNav">
  <div class="nav-inner">
    <a class="nav-logo" href="#/" data-link>🏘️ Downriver Hub</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="#/resources" data-link>🆓 Resources</a></li>
      <li><a href="#/board"     data-link>📋 Agora Board</a></li>
      <li><a href="#/bazaar"    data-link>🛒 Bazaar</a></li>
      <li><a href="#/messages"  data-link id="msgNavLink">💬 Messages <span class="badge hidden" id="msgBadge">0</span></a></li>
      <li class="staff-only hidden"><a href="#/admin" data-link>⚙️ Admin</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-icon" id="themeToggleBtn" title="Toggle dark mode">🌓</button>
      <div id="navAuthArea"></div>
    </div>
  </div>
</nav>

<!-- ── Page Content ────────────────────────────────────────────────────────── -->
<div class="app-wrapper">
  <main class="main-content" id="appRoot"></main>
</div>

<!-- ── Global Modals ───────────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="loginModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="authModalTitle">Sign In</span>
      <button class="modal-close" id="closeAuthModal">✕</button>
    </div>
    <div id="authModalContent"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="genericModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="genericModalTitle"></span>
      <button class="modal-close" id="closeGenericModal">✕</button>
    </div>
    <div id="genericModalContent"></div>
  </div>
</div>

<!-- Scripts -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/resources.js"></script>
<script src="/js/board.js"></script>
<script src="/js/messages.js"></script>
<script src="/js/bazaar.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
